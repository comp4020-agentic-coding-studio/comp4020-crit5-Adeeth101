<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090b18" />
    <title>Kage Run — an endless sticky ninja game</title>
    <meta name="description" content="Launch a sticky shadow ninja through an endless, shifting rooftop run." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card-kage-run.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <nav aria-label="Primary"><a href="./" aria-label="Kage Run home">影</a></nav>
    <main>
      <h1>Kage Run</h1>
      <canvas id="game" aria-label="Kage Run game canvas"></canvas>
      <div id="run-end" class="run-end" hidden>
        <div class="end-mark" aria-hidden="true">影</div>
        <p class="end-reason" id="run-reason" role="status"></p>
        <dl class="run-stats">
          <div><dt aria-label="Checkpoints">◆</dt><dd id="stat-checkpoints">0</dd></div>
          <div><dt aria-label="Targets">◎</dt><dd id="stat-targets">0</dd></div>
          <div><dt aria-label="Jumps saved">✦</dt><dd id="stat-jumps">0</dd></div>
          <div><dt aria-label="Time">◷</dt><dd id="stat-time">0:00</dd></div>
          <div class="score"><dt aria-label="Score">冠</dt><dd id="stat-score">0</dd></div>
        </dl>
        <button id="restart" type="button" aria-label="Restart run">↻</button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
